	/**
	 * Timezone 날짜 함수
	 */
	function calcTzDate(offset) {
		// create Date object for current location
		var d = new Date();

		// convert to msec
		// add local time zone offset 
		// get UTC time in msec
		var utc = d.getTime() + (d.getTimezoneOffset() * 60000);

		// create new Date object for different city
		// using supplied offset
		var nd = new Date(utc + (3600000 * offset));

		var tmpyy = nd.getFullYear();
		var ls_yy = (tmpyy > 99) ? tmpyy : 1900 + tmpyy;

		var tmpmon = nd.getMonth();
		var ls_mon = (tmpmon < 9) ? "0" + (tmpmon + 1) : tmpmon + 1;

		var tmpday = nd.getDate();
		var ls_day = (tmpday < 10) ? "0" + tmpday : tmpday;

		var tmphh = nd.getHours();
		var ls_hh = (tmphh < 10) ? "0" + tmphh : tmphh;

		var tmpmm = nd.getMinutes();
		var ls_mm = (tmpmm < 10) ? "0" + tmpmm : tmpmm;

		// return time as a string
		return ls_yy.toString() + ls_mon.toString() + ls_day.toString();
	}

	/**
	 * Timezone 시간 함수
	 */
	function calcTzTime(offset) {
		// create Date object for current location
		var d = new Date();

		// convert to msec
		// add local time zone offset 
		// get UTC time in msec
		var utc = d.getTime() + (d.getTimezoneOffset() * 60000);

		// create new Date object for different city
		// using supplied offset
		var nd = new Date(utc + (3600000 * offset));

		var tmphh = nd.getHours();
		var ls_hh = (tmphh < 10) ? "0" + tmphh : tmphh;

		var tmpmm = nd.getMinutes();
		var ls_mm = (tmpmm < 10) ? "0" + tmpmm : tmpmm;

		// return time as a string
		return ls_hh.toString() + ls_mm.toString();
	}

    function checkAccessBlockedURIMethod(url) {
        /**
         * 변수 초기화
         */
        if (checkAccessBlockedURI.get(url) != null) {
	    	var arrayValue = checkAccessBlockedURI.get(url).split("/");
	    	var blockStartDate = arrayValue[0];
	    	var blockEndDate = arrayValue[1];
	    	var blockStart = arrayValue[2];
	    	var blockEnd = arrayValue[3];

	    	/**
			 * 메뉴 블럭 유무 체크
			 */
			var city = '';
			var offset = '';
			var gmt = '';
			if ('AS' == 'EU') {
				city = 'London';
				offset = '+0';
				gmt = 'GMT+00:00';
			} else if ('AS' == 'AS') {
				city = 'Singapore';
				offset = '+8';
				gmt = 'GMT+08:00';
			} else if ('AS' == 'AM') {
				city = 'NewYork';
				offset = '-5';
				gmt = 'GMT-05:00';
			} else {
				city = 'Seoul';
				offset = '+9';
				gmt = 'GMT+09:00';
			}
			var returnValue = '';
			var currDate = parseInt(calcTzDate(offset));
			var checkAccessBlock = false;
			if (blockStartDate != '' || blockEndDate != '') {
				if (blockStartDate != '' && blockEndDate != '') {
					var nBlockStartDate = parseInt(blockStartDate);
					var nBlockEndDate = parseInt(blockEndDate);
					if ((currDate >= nBlockStartDate) && (currDate <= nBlockEndDate)) {
						if ((currDate == nBlockStartDate) && (currDate == nBlockEndDate)) {
							checkAccessBlock = true;
						} else if ((currDate == nBlockStartDate) && (currDate < nBlockEndDate)) {
							checkAccessBlock = false;
							var nHour = new Number(calcTzTime(offset));
							var nBlockStart = new Number(blockStart);
							if (nHour > nBlockStart) {
					  			alert("Temporarily cannot be accessed from " +  blockStartDate.substring(4, 6) + "/" + blockStartDate.substring(6, 8) + "/" +  blockStartDate.substring(0, 4) + " " + blockStart/100 + ":00 to " + blockEndDate.substring(4, 6) + "/" + blockEndDate.substring(6, 8) + "/" +  blockEndDate.substring(0, 4) + " " + blockEnd/100 + ":00 in " + city + " Time (" + gmt + ").");
					  			return false;
							}
						} else if ((currDate > nBlockStartDate) && (currDate < nBlockEndDate)) {
							checkAccessBlock = false;
				  			alert("Temporarily cannot be accessed from " +  blockStartDate.substring(4, 6) + "/" + blockStartDate.substring(6, 8) + "/" +  blockStartDate.substring(0, 4) + " " + blockStart/100 + ":00 to " + blockEndDate.substring(4, 6) + "/" + blockEndDate.substring(6, 8) + "/" +  blockEndDate.substring(0, 4) + " " + blockEnd/100 + ":00 in " + city + " Time (" + gmt + ").");
				  			return false;
						} else if ((currDate < nBlockStartDate) && (currDate == nBlockEndDate)) {
							checkAccessBlock = false;
							var nHour = new Number(calcTzTime(offset));
							var nBlockEnd	= new Number(blockEnd);
							if (nHour < nBlockEnd) {
					  			alert("Temporarily cannot be accessed from " +  blockStartDate.substring(4, 6) + "/" + blockStartDate.substring(6, 8) + "/" +  blockStartDate.substring(0, 4) + " " + blockStart/100 + ":00 to " + blockEndDate.substring(4, 6) + "/" + blockEndDate.substring(6, 8) + "/" +  blockEndDate.substring(0, 4) + " " + blockEnd/100 + ":00 in " + city + " Time (" + gmt + ").");
					  			return false;
							}
						}
					} else {
						checkAccessBlock = false;
					}
				} else if (blockStartDate != '' && blockEndDate == '') {
					var nBlockStartDate = parseInt(blockStartDate);
					if (currDate >= nBlockStartDate) {
						checkAccessBlock = true;
					} else {
						checkAccessBlock = false;
					}
				} else if (blockStartDate == '' && blockEndDate != '') {
					var nBlockEndDate = parseInt(blockEndDate);
					if (currDate <= nBlockEndDate) {
						checkAccessBlock = true;
					} else {
						checkAccessBlock = false;
					}
				}

				if (checkAccessBlock) {
					var nHour = new Number(calcTzTime(offset));
					var nBlockStart = new Number(blockStart);
					var nBlockEnd	= new Number(blockEnd);

					if (nBlockStart < nBlockEnd) {
						if (nHour > nBlockStart && nHour < nBlockEnd) {
							returnValue = "Temporarily cannot be accessed from " +  blockStart/100 + ":00 to " + blockEnd/100 + ":00 in " + city + " Time (" + gmt + ").";
						}
					} else if (nBlockStart > nBlockEnd) {
						if (!(nHour < nBlockStart && nHour > nBlockEnd) ) {
							returnValue = "Temporarily cannot be accessed from " +  blockStart/100 + ":00 to " + blockEnd/100 + ":00 in " + city + " Time (" + gmt + ").";
						}
					}
				}
			}

			if (returnValue != '') {
				alert(returnValue);
				return false;
			} else {
				return true;
			}
        } else {
			return true;
        }
    }
